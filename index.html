<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>직업 흥미 대모험 🎪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--brand:#FF5C8A;--brand2:#FF9A3D;--brand-dark:#E03E6E;--ink:#3a2e3a;--ink-soft:#7a6b78}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;height:100dvh}
  body{font-family:'Gaegu',sans-serif;color:var(--ink);background:linear-gradient(165deg,#FFF1F6,#F3F0FF 48%,#E7FBF3);
    overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100dvh}
  body.res-mode{overflow:hidden}
  .blob{position:fixed;border-radius:50%;filter:blur(38px);opacity:.5;z-index:0;animation:float 9s ease-in-out infinite}
  .b1{width:200px;height:200px;background:#FFD6E8;top:-40px;left:-50px}
  .b2{width:170px;height:170px;background:#D8E8FF;bottom:5%;right:-50px;animation-delay:-3s}
  .b3{width:150px;height:150px;background:#D9F7E6;top:40%;left:-60px;animation-delay:-5s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
  #app{position:relative;z-index:1;width:100%;max-width:480px;padding:12px 14px 10px;display:flex;flex-direction:column;flex:1;min-height:0;max-height:100dvh;margin:0 auto}
  @media (min-width:600px){
    body{background:linear-gradient(165deg,#EDE8F5,#E8E4F0 48%,#E0EDE8)}
    #app{background:linear-gradient(165deg,#FFF1F6,#F3F0FF 48%,#E7FBF3);border-radius:28px;box-shadow:0 24px 60px rgba(80,60,90,.18),0 0 0 1px rgba(255,255,255,.6);padding:14px 16px 12px;max-height:min(100dvh,900px);margin:8px auto}
  }
  h1,.jua,.btn{font-family:'Jua',sans-serif;font-weight:400}

  .topbar{display:flex;justify-content:center;margin-bottom:12px}
  .pill{font-family:'Jua',sans-serif;font-size:15px;color:#fff;background:var(--ink);padding:8px 20px;border-radius:999px;box-shadow:0 4px 0 #271f27}
  .card{background:#fff;border-radius:26px;padding:20px 18px;box-shadow:0 12px 30px rgba(120,80,110,.12)}

  /* intro */
  .intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:13px;padding:30px 22px 26px}
  .intro .emoji{font-size:68px;line-height:1;animation:pop .6s cubic-bezier(.2,1.4,.5,1) both,bob 2.6s ease-in-out .6s infinite}
  .intro h1{font-size:31px;line-height:1.2}
  .intro .sub{font-size:19px;color:var(--ink-soft);font-weight:700;line-height:1.5}
  .hint-chip{display:inline-block;background:#FFF0F5;color:var(--brand-dark);font-weight:700;font-size:16px;padding:9px 16px;border-radius:999px;border:2px dashed #FFC2D6}
  @keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}

  .btn{border:none;cursor:pointer;width:100%;font-size:21px;color:#fff;padding:15px;border-radius:18px;
    background:linear-gradient(180deg,var(--brand),var(--brand2));box-shadow:0 6px 0 var(--brand-dark);transition:transform .08s,box-shadow .08s}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--brand-dark)}
  .btn.ghost{background:#fff;color:var(--ink-soft);box-shadow:0 5px 0 #e4d8e2}
  .btn.ghost:active{box-shadow:0 1px 0 #e4d8e2}
  .btn.pulse{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}

  /* progress */
  .progress-wrap{margin-bottom:13px}
  .progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
  .progress-top .label{font-family:'Jua',sans-serif;font-size:16px;color:var(--ink-soft)}
  .progress-top .count{font-family:'Jua',sans-serif;font-size:17px;color:var(--brand-dark)}
  .track{height:13px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
  .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .45s cubic-bezier(.4,1.2,.5,1)}

  /* question */
  .q-card{animation:slideup .4s ease both}
  @keyframes slideup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .scene{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:40px;
    background:radial-gradient(circle at 50% 40%,#FFF4DA,#FFE7C2);box-shadow:0 6px 14px rgba(255,170,90,.25);animation:pop .45s cubic-bezier(.2,1.4,.5,1) both}
  .q-text{font-family:'Jua',sans-serif;font-size:21px;text-align:center;line-height:1.35;margin-bottom:16px}
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
    background:#FBF7FB;border:2.5px solid #efe6ee;border-radius:16px;padding:13px 14px;
    font-family:'Gaegu',sans-serif;font-weight:700;font-size:18px;color:var(--ink);transition:transform .12s,border-color .12s,background .12s}
  .opt:active{transform:scale(.98)}
  .opt .oe{font-size:24px;flex-shrink:0}
  .opt .ot{flex:1;line-height:1.3}
  .opt .check{margin-left:auto;font-size:21px;opacity:0;transform:scale(.4);transition:.2s}
  .opt.sel{background:#FFF0F6;border-color:var(--brand);box-shadow:0 6px 14px rgba(255,92,138,.18)}
  .opt.sel .check{opacity:1;transform:scale(1)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{font-size:18px;padding:13px}
  .nav .btn.back{flex:0 0 38%}

  /* result */
  .res{animation:slideup .5s ease both;flex:1;display:flex;flex-direction:column;width:100%;min-height:0;overflow:hidden}
  .res .card{padding:14px 12px;height:100%;display:flex;flex-direction:column;overflow:hidden}
  .res-carousel-wrap{flex:1;display:flex;align-items:stretch;gap:4px;min-height:0;height:0;width:100%}
  .page-turn{flex:0 0 46px;width:46px;height:52px;border:none;border-radius:14px;background:#fff;color:var(--ink);font-family:'Jua',sans-serif;font-size:11px;line-height:1.05;box-shadow:0 4px 0 #e4d8e2;cursor:pointer;transition:transform .08s,opacity .15s;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;align-self:center;flex-shrink:0}
  .page-turn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #e4d8e2}
  .page-turn:disabled{opacity:.35;cursor:default;box-shadow:0 2px 0 #eee}
  .page-turn .arr{display:block;font-size:20px;line-height:1}
  .res-carousel{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:0;height:100%;touch-action:pan-x pinch-zoom;align-items:stretch}
  .res-carousel::-webkit-scrollbar{display:none}
  .res-slide{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:0 1px;box-sizing:border-box;display:flex;min-height:0;height:100%;align-self:stretch}
  .res-slide-inner{flex:1;min-height:0;width:100%;height:100%;display:flex;flex-direction:column}
  .res-slide .card{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;padding-bottom:18px}
  .res-slide .card::-webkit-scrollbar{width:4px}
  .res-slide .card::-webkit-scrollbar-thumb{background:#eadfe8;border-radius:999px}
  .slide-body{flex:1;min-height:min-content;display:flex;flex-direction:column;justify-content:flex-start;gap:8px}
  .slide-body.centered{justify-content:center}
  .slide-top{flex-shrink:0}
  .page-chip{font-family:'Jua',sans-serif;font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:6px;flex-shrink:0}
  .res-dots{display:flex;justify-content:center;gap:5px;margin:6px 0 2px;flex-shrink:0;flex-wrap:wrap;max-width:100%;padding:0 4px}
  .dot{width:7px;height:7px;border-radius:50%;background:#e4d8e2;border:none;padding:0;transition:transform .2s,background .2s;flex-shrink:0}
  .dot.on{background:var(--brand);transform:scale(1.2)}
  .res-nav{display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .swipe-hint{text-align:center;font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:4px;flex-shrink:0}
  .res-foot{flex-shrink:0;padding-top:2px}
  .res-foot .btn{font-size:17px;padding:11px}
  .tiny{font-family:'Jua',sans-serif;font-size:14px;color:var(--ink-soft);text-align:center;margin-bottom:2px}
  .radar-center{max-width:168px;margin:0 auto}
  .res-slide--main .radar-center{max-width:158px}
  .radar-svg{display:block;width:100%}
  .type-line{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px}
  .mini-masc{width:38px;flex-shrink:0;line-height:0}
  .mini-masc svg{width:38px;height:auto;display:block;animation:none}
  .type-name{font-family:'Jua',sans-serif;font-size:24px;line-height:1.1}
  .charname{font-family:'Jua',sans-serif;font-size:16px;text-align:center;margin-top:1px}

  .interp{margin-top:8px;padding:10px 12px}
  .badge-row{display:flex;gap:6px;justify-content:center;margin-bottom:4px}
  .bdg{font-family:'Jua',sans-serif;font-size:13px;padding:5px 11px;border-radius:999px}
  .bdg.gold{background:#FFF1C9;color:#946400}
  .bdg.silver{background:#ECEFF3;color:#5B6470}
  .interp p{font-weight:700;font-size:17px;line-height:1.5;text-align:center;margin:0}

  .jobs-wrap{margin-top:13px}
  .jt{font-family:'Jua',sans-serif;font-size:17px;display:block;margin:0 4px 9px}
  .jobs{display:flex;flex-wrap:wrap;gap:8px}
  .job{font-family:'Gaegu',sans-serif;font-weight:700;font-size:17px;color:#fff;padding:8px 14px;border-radius:999px;box-shadow:0 4px 10px rgba(0,0,0,.1);animation:jobin .4s ease both}
  @keyframes jobin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

  .guide{margin-top:0}
  .guide .st{font-family:'Jua',sans-serif;font-size:15px;display:block;margin:0 0 6px}
  .kw-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
  .kw{font-family:'Gaegu',sans-serif;font-weight:700;font-size:14px;padding:5px 10px;border-radius:999px;background:#FBF7FB;border:2px solid #efe6ee}
  .env-box{background:linear-gradient(135deg,#FFF8FC,#F8F4FF);border-radius:14px;padding:10px 12px;border:2px dashed #eadfe8}
  .env-box .el{font-family:'Jua',sans-serif;font-size:13px;color:var(--ink-soft);margin-bottom:3px}
  .env-box p{font-weight:700;font-size:14px;line-height:1.4;margin:0}
  .job-mini{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#FBF7FB;border:2px solid #efe6ee}
  .job-mini .ji{font-size:20px;line-height:1;flex-shrink:0}
  .job-mini .jb{min-width:0}
  .job-mini .jn{font-family:'Jua',sans-serif;font-size:15px;line-height:1.2;display:block}
  .job-mini .jd{font-weight:700;font-size:13px;line-height:1.35;color:var(--ink-soft);margin:2px 0 0}
  .job-minis{display:flex;flex-direction:column;gap:5px}
  .slide-body.dense .env-box{padding:8px 10px}
  .slide-body.dense .job-mini{padding:7px 9px}
  .fit-list{display:flex;flex-direction:column;gap:7px}
  .fit-item{border-radius:14px;padding:10px 11px;background:#fff;border:2px solid #efe6ee}
  .fit-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .fit-badge{font-family:'Jua',sans-serif;font-size:13px;padding:4px 10px;border-radius:999px;color:#fff}
  .fit-why{font-weight:700;font-size:14px;line-height:1.35;margin:0 0 5px}
  .act-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
  .act{font-family:'Gaegu',sans-serif;font-weight:700;font-size:13px;padding:4px 8px;border-radius:999px;background:#FFF8E8;border:2px solid #FFE8A8}
  .preview-chip{display:inline-block;margin-top:8px;background:#E8F4FF;color:#2B6CB0;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px}
  .info-box{border-radius:14px;padding:10px 11px;background:#FFFBF8;border:2px solid #f5ebe8}
  .info-box .il{font-family:'Jua',sans-serif;font-size:13px;color:var(--ink-soft);margin-bottom:4px}
  .info-box p{font-weight:700;font-size:14px;line-height:1.4;margin:0}
  .trait-list{list-style:none;display:flex;flex-direction:column;gap:5px}
  .trait-list li{font-weight:700;font-size:14px;line-height:1.35;padding:7px 10px;border-radius:12px;background:#FBF7FB;border:2px solid #efe6ee}
  .trait-list li::before{content:'✦ ';color:var(--brand-dark)}
  .major-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
  .major{font-family:'Gaegu',sans-serif;font-weight:700;font-size:13px;padding:6px 10px;border-radius:10px;border:2px solid}
  .jobs-wrap{margin-top:0}
  .jobs.compact{justify-content:center}
  .jobs.compact .job{font-size:14px;padding:6px 11px}
  .desc-line{font-weight:700;font-size:14px;line-height:1.4;text-align:center;margin:0}
  .slide-note{font-weight:700;font-size:12px;color:var(--ink-soft);text-align:center;margin:0 0 4px;line-height:1.3}
  .slide-body.dense{gap:6px;justify-content:flex-start}
  .slide-body.dense .st{margin-bottom:4px}
  .trait-list.compact{gap:4px}
  .trait-list.compact li{font-size:13px;padding:5px 9px}
  .fit-list.tight{gap:5px}
  .fit-list.tight .fit-item{padding:8px 9px}
  .fit-list.tight .fit-why{font-size:13px;margin-bottom:4px;-webkit-line-clamp:2}
  .finish-box{text-align:center;border-radius:16px;padding:12px 14px;background:linear-gradient(135deg,#FFF8FC,#F0FFF4);border:2px dashed #eadfe8;margin-top:6px}
  .finish-box .fe{font-size:28px;line-height:1;margin-bottom:6px}
  .finish-box .ft{font-family:'Jua',sans-serif;font-size:16px;color:var(--brand-dark);margin-bottom:5px}
  .finish-box .fm{font-weight:700;font-size:13px;line-height:1.45;color:var(--ink-soft);margin:0}

  .res-actions{margin-top:0}

  .confetti{position:fixed;top:-20px;width:11px;height:11px;z-index:50;opacity:.9;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div id="app"></div>

<script>
const MASCOT = {
  R:{light:'#FFD7D7',body:'#FF9E9E',shade:'#EE7C7C',
     front:`<path d="M33 44 A27 25 0 0 1 87 44 Z" fill="#FFC83D"/><rect x="29" y="41" width="62" height="7.5" rx="3.7" fill="#F2B100"/><rect x="56" y="24" width="8" height="9" rx="4" fill="#F2B100"/><g transform="translate(90 90) rotate(35)"><rect x="-2.5" y="0" width="5" height="16" rx="2.5" fill="#AEB6C2"/><circle cx="0" cy="-2" r="6.5" fill="none" stroke="#AEB6C2" stroke-width="4"/></g>`},
  I:{light:'#FBCFE0',body:'#F49BBC',shade:'#E87BA1',
     front:`<circle cx="48" cy="62" r="11.5" fill="none" stroke="#5b4a58" stroke-width="2.6"/><circle cx="72" cy="62" r="11.5" fill="none" stroke="#5b4a58" stroke-width="2.6"/><path d="M59 60 q1 -2.5 2 0" stroke="#5b4a58" stroke-width="2.6" fill="none"/><g transform="translate(93 42) rotate(18)"><circle cx="0" cy="0" r="9.5" fill="#D8ECFF" stroke="#5b4a58" stroke-width="3"/><rect x="-2.6" y="8" width="5.2" height="15" rx="2.6" fill="#5b4a58"/></g>`},
  A:{light:'#DED3FB',body:'#BBA6F7',shade:'#9E83EF',
     front:`<g transform="translate(60 33) rotate(-13)"><ellipse cx="0" cy="2" rx="23" ry="10" fill="#7E5FD6"/><ellipse cx="0" cy="-1" rx="23" ry="9" fill="#9B7DEE"/><circle cx="0" cy="-8" r="3.6" fill="#7E5FD6"/></g><g transform="translate(90 86) rotate(42)"><rect x="-2.6" y="-4" width="5.2" height="18" rx="2.6" fill="#C98A52"/><path d="M-4 12 h8 l-1.5 9 h-5 z" fill="#9775FA"/></g>`},
  S:{light:'#CFE7FB',body:'#9CCDF7',shade:'#74B4EF',
     front:`<g transform="translate(60 92)"><path d="M0 8 C -8 1 -8 -7 -3.6 -7 C -1.2 -7 0 -4.8 0 -2.8 C 0 -4.8 1.2 -7 3.6 -7 C 8 -7 8 1 0 8 Z" fill="#FF6B8A"/><ellipse cx="-2.4" cy="-2.4" rx="1.7" ry="2.5" fill="#fff" opacity=".7"/></g><g transform="translate(92 40)" fill="#FFD93D"><path d="M0 -7 L1.6 -1.6 L7 0 L1.6 1.6 L0 7 L-1.6 1.6 L-7 0 L-1.6 -1.6 Z"/></g>`},
  E:{light:'#C9F1D2',body:'#97E0A6',shade:'#6FD083',
     behind:`<path d="M30 60 Q60 54 90 60 L100 114 Q60 104 20 114 Z" fill="#FF6B6B"/>`,
     front:`<g transform="translate(92 38)"><path d="M0 -11 L3.2 -3.4 L11 -3 L4.8 2 L6.8 10 L0 5 L-6.8 10 L-4.8 2 L-11 -3 L-3.2 -3.4 Z" fill="#FFD93D" stroke="#F2B100" stroke-width="1"/></g>`},
  C:{light:'#FDECB2',body:'#FAD471',shade:'#F2C040',
     front:`<g transform="translate(60 91) rotate(-6)"><rect x="-17" y="-15" width="34" height="32" rx="4.5" fill="#FFFDF6" stroke="#E0A93A" stroke-width="2.6"/><rect x="-8" y="-19" width="16" height="7.5" rx="3.5" fill="#C98A2E"/><line x1="-9" y1="-4" x2="8" y2="-4" stroke="#E9CE86" stroke-width="2.6" stroke-linecap="round"/><line x1="-9" y1="3" x2="2" y2="3" stroke="#E9CE86" stroke-width="2.6" stroke-linecap="round"/><path d="M-11 9 l3.5 3.5 l6 -7" stroke="#51CF66" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`},
};
function mascot(t){
  const m=MASCOT[t]; const g='mg_'+t;
  return `<svg viewBox="0 0 120 124" class="masc" xmlns="http://www.w3.org/2000/svg">
    <defs><radialGradient id="${g}" cx="50%" cy="32%" r="72%"><stop offset="0%" stop-color="${m.light}"/><stop offset="100%" stop-color="${m.body}"/></radialGradient></defs>
    <ellipse cx="46" cy="112" rx="10" ry="6.5" fill="${m.shade}"/><ellipse cx="74" cy="112" rx="10" ry="6.5" fill="${m.shade}"/>
    ${m.behind||''}
    <ellipse cx="60" cy="66" rx="42" ry="44" fill="url(#${g})"/>
    <ellipse cx="39" cy="76" rx="7.5" ry="5" fill="#FF8FB0" opacity=".5"/><ellipse cx="81" cy="76" rx="7.5" ry="5" fill="#FF8FB0" opacity=".5"/>
    <ellipse cx="48" cy="62" rx="9" ry="9.5" fill="#fff"/><ellipse cx="72" cy="62" rx="9" ry="9.5" fill="#fff"/>
    <circle cx="49" cy="63" r="4.8" fill="#4a3b48"/><circle cx="71" cy="63" r="4.8" fill="#4a3b48"/>
    <circle cx="47.2" cy="61" r="1.8" fill="#fff"/><circle cx="69.2" cy="61" r="1.8" fill="#fff"/>
    <path d="M53 76 q7 6 14 0" stroke="#4a3b48" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    ${m.front||''}
  </svg>`;
}

const TYPES = {

  document.querySelector('.back').onclick=()=>{ if(qIndex===0){renderIntro();} else {qIndex--;renderQuestion();} };
}

function computeScores(){const s={R:0,I:0,A:0,S:0,E:0,C:0};answers.forEach(a=>{if(a)s[a]++;});return s;}
function pickTop(sc,ex){let b=null,v=-1;ORDER.forEach(k=>{if(k===ex)return;if(sc[k]>v){v=sc[k];b=k;}});return b;}
function tint(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}

function buildRadar(scores,hex){
  const cx=150,cy=150,R=98,maxScale=Math.max(...Object.values(scores),1);
  let bg='';
  [0.25,0.5,0.75,1].forEach(p=>{
    const pts=ORDER.map((k,i)=>{const a=(-90+i*60)*Math.PI/180;return `${cx+Math.cos(a)*R*p},${cy+Math.sin(a)*R*p}`;}).join(' ');
    bg+=`<polygon points="${pts}" fill="none" stroke="#eadfe8" stroke-width="1.5"/>`;
  });
  ORDER.forEach((k,i)=>{const a=(-90+i*60)*Math.PI/180;bg+=`<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*R}" y2="${cy+Math.sin(a)*R}" stroke="#eadfe8" stroke-width="1.5"/>`;});
  const poly=ORDER.map((k,i)=>{const a=(-90+i*60)*Math.PI/180;const r=R*(scores[k]/maxScale);return `${cx+Math.cos(a)*r},${cy+Math.sin(a)*r}`;}).join(' ');
  let dots='',labels='';
  ORDER.forEach((k,i)=>{
    const a=(-90+i*60)*Math.PI/180;const r=R*(scores[k]/maxScale);
    dots+=`<circle cx="${cx+Math.cos(a)*r}" cy="${cy+Math.sin(a)*r}" r="6" fill="${TYPES[k].hex}"/>`;
    const lx=cx+Math.cos(a)*(R+26), ly=cy+Math.sin(a)*(R+26);
    labels+=`<text x="${lx}" y="${ly+5}" text-anchor="middle" font-family="Jua" font-size="18" fill="${TYPES[k].hex}">${TYPES[k].name.replace('형','')}</text>`;
  });
  return `<svg class="radar-svg" viewBox="0 0 300 300">${bg}<polygon points="${poly}" fill="${tint(hex,0.32)}" stroke="${hex}" stroke-width="3.2"/>${dots}${labels}</svg>`;
}

const SLIDE_LABELS=['나의 유형','성격·전공','강점·직업','궁합·활동','진로 탐색'];

function buildResultSlides(P,T,S,radar,jobs){
  const g=CAREER_EXTRA[P];
  const kws=g.keywords.map(k=>`<span class="kw">${k}</span>`).join('');
  const traits=g.traits.map(t=>`<li>${t}</li>`).join('');
  const majors=g.majors.map(m=>`<span class="major" style="border-color:${T.hex};background:${tint(T.hex,0.14)};color:${T.hex}">${m}</span>`).join('');
  const jobMinis=g.jobDetails.map(j=>`
    <div class="job-mini">
      <span class="ji">${j.e}</span>
      <div class="jb"><span class="jn">${j.n}</span><p class="jd">${j.d}</p></div>
    </div>`).join('');
  const fitHtml=(f)=>{const ft=TYPES[f.code];const acts=f.acts.map(a=>`<span class="act">${a}</span>`).join('');
    return `<div class="fit-item">
      <div class="fit-top"><span class="fit-badge" style="background:${ft.hex}">${ft.name}</span></div>
      <p class="fit-why">${f.why}</p>
      <div class="act-row">${acts}</div>
    </div>`;};
  return [
    `<div class="res-slide res-slide--main"><div class="res-slide-inner">
      <div class="card">
        <div class="slide-body centered">
          <div class="slide-top">
            <div class="tiny">나의 직업 흥미 유형은?</div>
            <div class="radar-center">${radar}</div>
            <div class="type-line">
              <span class="mini-masc">${mascot(P)}</span>
              <span class="type-name" style="color:${T.hex}">${T.name} (${T.code})</span>
            </div>
            <div class="charname" style="color:${T.hex}">${T.charName}</div>
          </div>
          <div class="badge-row"><span class="bdg gold">🥇 ${T.name}</span><span class="bdg silver">🥈 ${S.name}</span></div>
          <p class="desc-line">너의 강점은 <b style="color:${T.hex}">${T.name}</b>! ${T.desc}</p>
        </div>
      </div>
    </div></div>`,
    `<div class="res-slide"><div class="res-slide-inner">
      <div class="card guide">
        <div class="slide-body dense">
          <span class="st">🧠 나의 성격</span>
          <div class="info-box"><p>${g.personality}</p></div>
          <span class="st">✨ 이런 특징이 있어요</span>
          <ul class="trait-list compact">${traits}</ul>
          <span class="st">🎓 추천 전공 계열</span>
          <div class="major-row">${majors}</div>
        </div>
      </div>
    </div></div>`,
    `<div class="res-slide"><div class="res-slide-inner">
      <div class="card guide">
        <div class="slide-body dense">
          <span class="st">✨ 나의 강점 키워드</span>
          <div class="kw-row">${kws}</div>
          <div class="env-box">
            <div class="el">🌱 잘 맞는 환경</div>
            <p>${g.env}</p>
          </div>
          <span class="st">💼 직업 한눈에 보기</span>
          <div class="job-minis">${jobMinis}</div>
        </div>
      </div>
    </div></div>`,
    `<div class="res-slide"><div class="res-slide-inner">
      <div class="card guide">
        <div class="slide-body dense">
          <span class="st">🤝 잘 맞는 유형 + 활동</span>
          <p class="slide-note">함께하면 시너지가 나는 친구 유형이에요</p>
          <div class="fit-list tight">${g.fits.map(fitHtml).join('')}</div>
        </div>
      </div>
    </div></div>`,
    `<div class="res-slide res-slide--finish"><div class="res-slide-inner">
      <div class="card guide">
        <div class="slide-body dense">
          <span class="st">💼 이런 직업 어때?</span>
          <div class="jobs-wrap"><div class="jobs compact">${jobs}</div></div>
          <div class="finish-box">
            <div class="fe">🎉</div>
            <div class="ft">오늘의 검사 끝!</div>
            <p class="fm">오늘 알아본 <b style="color:${T.hex}">${T.name}</b> 유형을<br>진로 탐색할 때 참고해 봐요.<br>선생님·친구와 이야기 나누며<br>나만의 길을 찾아가요 ✨</p>
          </div>
        </div>
      </div>
    </div></div>`
  ];
}

function initResultCarousel(){
  const carousel=document.getElementById('resCarousel');
  const chip=document.getElementById('pageChip');
  const prev=document.getElementById('prevPage');
  const next=document.getElementById('nextPage');
  const dots=[...document.querySelectorAll('.res-dots .dot')];
  if(!carousel) return;
  const total=dots.length;
  const go=(n)=>{
    const i=Math.max(0,Math.min(total-1,n));
    carousel.scrollTo({left:i*carousel.offsetWidth,behavior:'smooth'});
  };
  const sync=()=>{
    const i=Math.round(carousel.scrollLeft/carousel.offsetWidth);
    dots.forEach((d,n)=>d.classList.toggle('on',n===i));
    if(chip) chip.textContent=i>=total-1?`🏁 마지막 · ${SLIDE_LABELS[i]}`:`${i+1} / ${total} · ${SLIDE_LABELS[i]}`;
    if(prev) prev.disabled=i<=0;
    if(next) next.disabled=i>=total-1;
  };
  carousel.addEventListener('scroll',sync,{passive:true});
  dots.forEach((d,n)=>d.onclick=()=>go(n));
  if(prev) prev.onclick=()=>go(Math.round(carousel.scrollLeft/carousel.offsetWidth)-1);
  if(next) next.onclick=()=>go(Math.round(carousel.scrollLeft/carousel.offsetWidth)+1);
  sync();
}

function renderResult(previewType){
  document.body.classList.add('res-mode');
  let scores;
  if(previewType){scores={R:0,I:0,A:0,S:0,E:0,C:0};scores[previewType]=6;}
  else scores=computeScores();
  const P=previewType||pickTop(scores,null), Sub=pickTop(scores,P);
  const T=TYPES[P], S=TYPES[Sub];
  const radar=buildRadar(scores,T.hex);
  const jobs=T.jobs.map((j,i)=>`<span class="job" style="background:${T.hex};animation-delay:${0.15+i*0.07}s">${j}</span>`).join('');
  const slides=buildResultSlides(P,T,S,radar,jobs).join('');
  const dots=SLIDE_LABELS.map((_,i)=>`<button type="button" class="dot${i?'':' on'}" aria-label="${i+1}번째 결과"></button>`).join('');
  const previewNote=previewType?'<span class="preview-chip">👀 진로시간 예시 미리보기</span>':'';
  app.innerHTML=topbar()+`
    <div class="res">
      <div class="page-chip" id="pageChip">1 / ${SLIDE_LABELS.length} · ${SLIDE_LABELS[0]}</div>
      ${previewNote?`<div style="text-align:center;margin-bottom:6px">${previewNote}</div>`:''}
      <div class="res-carousel-wrap">
        <button type="button" class="page-turn" id="prevPage" disabled aria-label="이전 페이지"><span class="arr">◀</span>이전</button>
        <div class="res-carousel" id="resCarousel">${slides}</div>
        <button type="button" class="page-turn" id="nextPage" aria-label="다음 페이지"><span class="arr">▶</span>다음</button>
      </div>
      <div class="res-nav"><div class="res-dots">${dots}</div></div>
      <div class="swipe-hint">◀ ▶ 옆으로 넘기기 · 내용이 길면 ↕ 아래로 스크롤</div>
      <div class="res-foot res-actions">
        <button class="btn" id="retry">🔄 다시 검사하기</button>
      </div>
    </div>`;
  initResultCarousel();
  launchConfetti();
  document.getElementById('retry').onclick=()=>{
    answers=new Array(QUESTIONS.length).fill(null); answersIdx=new Array(QUESTIONS.length).fill(null); qIndex=0; renderIntro();
  };
}

function launchConfetti(){
  const cols=['#FF6B6B','#F06595','#9775FA','#4DABF7','#51CF66','#FCC419','#FF9A3D'];
  for(let i=0;i<42;i++){const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.animationDuration=(2.4+Math.random()*1.7)+'s';c.style.animationDelay=(Math.random()*0.5)+'s';
    if(Math.random()>0.5)c.style.borderRadius='50%';c.style.width=c.style.height=(8+Math.random()*7)+'px';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4700);}
}
const previewParam=new URLSearchParams(location.search).get('preview')?.toUpperCase();
if(previewParam&&TYPES[previewParam]) renderResult(previewParam);
else renderIntro();
</script>
